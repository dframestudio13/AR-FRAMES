<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Frames - MindAR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 16px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="status">Starting AR...</div>
    
 <button
  id="startVideo"
  type="button"
  style="
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999999;
    pointer-events: auto;
    touch-action: manipulation;
    padding: 18px 30px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #007aff;
  ">
  Start AR

   
</button>


  
  
<a-scene
  mindar-image="
  imageTargetSrc: ./targets (3).mind;
  autoStart: true;
  uiScanning: true;
  uiLoading: true;
  filterMinCF: 0.0003;
  filterBeta: 0.003;
  warmupTolerance: 10;
  missTolerance: 10;
"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true, antialias:true, precision:high"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
   <a-assets>
  <video
  id="arVideo"
  src="./ASHAKA-TRIGGER-VIDEO.mp4"
  preload="auto"
  loop
  playsinline
  webkit-playsinline>
</video>
</a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
   <a-video
  src="#arVideo"
  position="0 0 0.01"
  rotation="0 0 0"
  width="1"
  height="1.375">
</a-video>   
    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const target = document.getElementById("target");
    const video = document.getElementById("arVideo");
    const startButton = document.getElementById("startVideo");
let videoUnlocked = false;

startButton.addEventListener("click", async (event) => {
  event.preventDefault();
  event.stopPropagation();

  try {
    video.muted = false;

    await video.play();

    videoUnlocked = true;
    startButton.style.display = "none";
    status.innerHTML = "Point camera at image";
  } catch (error) {
    console.log(error);
    status.innerHTML = "Could not start video";
  }
});
   scene.addEventListener("renderstart", () => {
  const renderer = scene.renderer;

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  status.innerHTML = "Camera ready — point at image";
});

  target.addEventListener("targetFound", () => {
  status.innerHTML = "TARGET FOUND!";
  status.style.background = "green";

  if (videoUnlocked) {
    video.play();
  }
});
   target.addEventListener("targetLost", () => {
  status.innerHTML = "Target lost — searching...";
  status.style.background = "rgba(0, 0, 0, 0.75)";

  video.pause();
});
    document.body.addEventListener("click", () => {
  video.play();
});
  </script>

</body>
</html>
