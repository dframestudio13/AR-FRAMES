<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <style>
    <div id="status"
     style="position:fixed;
            top:20px;
            left:20px;
            z-index:99999;
            background:red;
            color:white;
            padding:15px;
            font-size:20px;">
  SEARCHING FOR IMAGE...
</div>

<script>
  const marker = document.querySelector("#marker");
  const status = document.querySelector("#status");

  marker.addEventListener("markerFound", () => {
    status.innerHTML = "MARKER FOUND!";
    status.style.background = "green";
  });

  marker.addEventListener("markerLost", () => {
    status.innerHTML = "MARKER LOST";
    status.style.background = "red";
  });
</script>
    body {
      margin: 0;
      overflow: hidden;
    }

    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: rgba(0,0,0,.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arjs-loader div {
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

<div class="arjs-loader">
  <div>Loading AR...</div>
</div>

<a-scene
  vr-mode-ui="enabled: false;"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  embedded
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
>

  <a-nft
  id="marker"
  type="nft"
  url="./myframe-fixed"
  smooth="true"
  smoothCount="10"
  smoothTolerance="0.01"
  smoothThreshold="5"
>

    <a-box
      position="150 150 -100"
      scale="80 80 80"
      color="red">
    </a-box>

  </a-nft>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
