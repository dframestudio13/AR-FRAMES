<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Frames - MindAR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 16px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="status">Starting AR...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; uiLoading: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
   <a-assets>
  <video
    id="arVideo"
    src="./portrait-video.mp4"
    preload="auto"
    loop
    muted
    autoplay
    playsinline
    webkit-playsinline>
  </video>
</a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
     <a-video
      src="#arVideo"
      position="0 0 0.01"
      width="1"
      height="1.777">
   </a-video>
    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const target = document.getElementById("target");
    const video = document.getElementById("arVideo");

    scene.addEventListener("renderstart", () => {
      status.innerHTML = "Camera ready — point at image";
    });

    target.addEventListener("targetFound", async () => {
  status.innerHTML = "TARGET FOUND!";
  status.style.background = "green";

  try {
    video.muted = true;
    video.playsInline = true;
    await video.play();
  } catch (err) {
    console.log("Video play error:", err);
    status.innerHTML = "Tap screen to start video";
  }
});

    target.addEventListener("targetLost", () => {
      status.innerHTML = "Target lost — searching...";
      status.style.background = "rgba(0, 0, 0, 0.75)";
      video.pause();
      video.currentTime = 0;
    });

    document.body.addEventListener("click", () => {
  video.play();
});
  </script>

</body>
</html>
