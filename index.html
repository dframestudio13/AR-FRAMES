<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Frames - MindAR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 16px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="status">Starting AR...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; uiLoading: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-box
        position="0 0 0.1"
        scale="0.4 0.4 0.4"
        color="red">
      </a-box>
    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const target = document.getElementById("target");

    scene.addEventListener("renderstart", () => {
      status.innerHTML = "Camera ready — point at image";
    });

    target.addEventListener("targetFound", () => {
      status.innerHTML = "TARGET FOUND!";
      status.style.background = "green";
    });

    target.addEventListener("targetLost", () => {
      status.innerHTML = "Target lost — searching...";
      status.style.background = "rgba(0, 0, 0, 0.75)";
    });
  </script>

</body>
</html>
