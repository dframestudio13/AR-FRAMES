<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <div id="status"
       style="
       position:fixed;
       top:20px;
       left:20px;
       z-index:9999;
       background:#111;
       color:white;
       padding:12px;
       font-family:Arial;">
    Starting AR...
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-nft
      id="marker"
      type="nft"
      url="./myframe-fixed"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <a-box
        position="150 250 -100"
        scale="60 60 60"
        color="red">
      </a-box>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const marker = document.getElementById("marker");

    window.addEventListener("arjs-video-loaded", () => {
      status.innerText = "Camera ready — point at image";
    });

    window.addEventListener("arjs-nft-loaded", () => {
      status.innerText = "NFT files loaded — searching...";
    });

    marker.addEventListener("markerFound", () => {
      status.innerText = "MARKER FOUND!";
      status.style.background = "green";
    });

    marker.addEventListener("markerLost", () => {
      status.innerText = "Marker lost — searching...";
      status.style.background = "#111";
    });

    window.addEventListener("error", (e) => {
      status.innerText = "ERROR: " + e.message;
      status.style.background = "red";
    });
  </script>

</body>
</html>
